<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truck Driver Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚚 Truck Driver Expense Tracker</h1>
            <p class="subtitle">Manage your expenses on the road</p>
        </header>

        <!-- Dashboard Summary -->
        <div class="dashboard">
            <div class="stat-card">
                <h3>Total Expenses</h3>
                <p class="stat-value" id="totalExpenses">$0.00</p>
            </div>
            <div class="stat-card">
                <h3>This Month</h3>
                <p class="stat-value" id="monthExpenses">$0.00</p>
            </div>
            <div class="stat-card">
                <h3>Total Entries</h3>
                <p class="stat-value" id="totalEntries">0</p>
            </div>
        </div>

        <!-- Expense Form -->
        <div class="form-container">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="fuel">⛽ Fuel</option>
                            <option value="tolls">🛣️ Tolls</option>
                            <option value="maintenance">🔧 Maintenance</option>
                            <option value="food">🍔 Food</option>
                            <option value="lodging">🏨 Lodging</option>
                            <option value="parking">🅿️ Parking</option>
                            <option value="insurance">📋 Insurance</option>
                            <option value="other">📦 Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount ($) *</label>
                        <input type="number" id="amount" step="0.01" min="0" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="City, State">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="Add notes about this expense..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Expense</button>
                    <button type="button" class="btn btn-secondary" id="clearForm">Clear</button>
                </div>
            </form>
        </div>

        <!-- Filters and Actions -->
        <div class="controls">
            <div class="filters">
                <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="fuel">Fuel</option>
                    <option value="tolls">Tolls</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="food">Food</option>
                    <option value="lodging">Lodging</option>
                    <option value="parking">Parking</option>
                    <option value="insurance">Insurance</option>
                    <option value="other">Other</option>
                </select>
                <select id="sortBy">
                    <option value="date-desc">Date (Newest)</option>
                    <option value="date-asc">Date (Oldest)</option>
                    <option value="amount-desc">Amount (High to Low)</option>
                    <option value="amount-asc">Amount (Low to High)</option>
                </select>
            </div>
            <div class="actions">
                <button class="btn btn-export" id="exportCSV">📥 Export CSV</button>
                <button class="btn btn-danger" id="clearAll">🗑️ Clear All</button>
            </div>
        </div>

        <!-- Expense List -->
        <div class="expense-list-container">
            <h2>Expense History</h2>
            <div id="expenseList" class="expense-list">
                <p class="empty-state">No expenses recorded yet. Add your first expense above!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
